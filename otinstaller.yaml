# OTInstaller manifest. Reference: https://otinstaller.com/docs/manifest
# yaml-language-server: $schema=https://otinstaller.com/schema/v1.json
schema: 1
name: eth-address
namespace: osintverse-community
version: 0.1.0
summary: "Looks up an Ethereum address: balance, ENS name, contract info, recent transactions"
readme: README.md
license: MIT
homepage: https://github.com/osintverse-community/eth-address
categories: [crypto]
tags: [ethereum, blockchain, blockscout, ens]
inputs:
  - name: address
    type: crypto_address
    required: true
outputs:
  - type: crypto_address
  - type: transaction
runtime:
  kind: docker
  # Filled in by the release workflow with the pushed image's digest.
  image: ghcr.io/osintverse-community/eth-address@sha256:ebc35d50a9687e9fa73846f51c989551d8582b89a6da30f64f3b105d0d8eea40
  platforms: [linux/amd64, linux/arm64]
  command: ["eth-address", "{address}"]
  output_format: json
  timeout_seconds: 300
network:
  egress: true
  domains: ["eth.blockscout.com"]
ethics:
  touches_target: false
  auth_required: false
  collects_personal_data: false
test:
  input: { address: "0x314159265dD8dbb310642f98f50C066173C1259b" }
